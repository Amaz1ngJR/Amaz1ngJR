name: Generate Language Metrics

on:
  schedule:
    # 每天 UTC 20:17 运行一次（错开整点，避开高峰）
    - cron: "17 20 * * *"
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak card
        run: |
          python3 scripts/gen_streak.py metrics/streak.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: Amaz1ngJR

      - name: Commit streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/streak.svg
          if git diff --cached --quiet; then
            echo "streak 卡片无变化，跳过提交"
          else
            git commit -m "chore: 更新 streak 卡片"
            git push
          fi

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # 继任项目按字节降序取每仓前 10 种语言；lowlighter/metrics 只取前 8 且不排序，会漏掉 Lua
          options: username=Amaz1ngJR&layout=compact&langs_count=10&theme=tokyonight&hide_border=true&text_color=a9b1d6&custom_title=Most%20Used%20Languages
          path: metrics/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # 限流/出错时让 job 失败，而不是把「Something went wrong」坏卡写进仓库
          fail_on_error: true

      - name: Commit top languages card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/top-langs.svg
          if git diff --cached --quiet; then
            echo "top-langs 卡片无变化，跳过提交"
          else
            git commit -m "chore: 更新 top-langs 卡片"
            git push
          fi

      - name: Generate activity card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Amaz1ngJR
          filename: metrics/activity.svg

          # 提交/PR/Issue 概览（plugin_habits 已知在某些情况下会报 Unexpected error，暂时关闭）
          base: "activity"
          # plugin_habits: yes
          # plugin_habits_charts: yes
          # plugin_habits_facts: no
          # plugin_habits_days: 14
          # plugin_habits_charts_type: classic

          config_timezone: Asia/Shanghai

          extras_css: |
            svg, .background, foreignObject > div {
              background: #1a1b27 !important;
              background-color: #1a1b27 !important;
            }
            h1, h2, h3, text, tspan, .field, .value, div, span, p {
              color: #a9b1d6 !important;
              fill: #a9b1d6 !important;
            }
            h1, h2, h3 { color: #70a5fd !important; fill: #70a5fd !important; }
            svg { border: none !important; }
            .field svg { fill: #565f89 !important; }
            /* 贡献格/图表里 #ebedf0 的浅色底换成深色，绿色数据块保留 */
            [fill="#ebedf0"] { fill: #23243a !important; }

          # 直接提交回 main（目标文件已预先存在，避免 oid 判空崩溃）
          output_action: commit
          committer_branch: main
